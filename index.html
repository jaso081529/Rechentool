<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rechnungstool • HP67</title>
  <meta name="description" content="Lokales Rechnungstool. Offline nutzbar. Live-Vorschau. PDF via Drucken." />
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png" type="image/png" />
  <meta name="theme-color" content="#111827">
  <link rel="stylesheet" href="style.css">
  <script>
    // PWA install
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
      });
    }
  </script>
</head>
<body>
<header class="app-header">
  <div class="brand">
    <img src="icons/icon-192.png" alt="HP67" class="logo">
    <h1>Rechnungstool</h1>
  </div>
  <div class="header-actions">
    <button id="btn-new" class="btn">Neue Rechnung</button>
    <button id="btn-save" class="btn">Zwischenspeichern</button>
    <button id="btn-export-json" class="btn">JSON exportieren</button>
    <label for="import-json" class="btn btn-ghost">JSON importieren</label>
    <input id="import-json" type="file" accept="application/json" hidden>
    <button id="btn-reset" class="btn btn-danger">Alles zurücksetzen</button>
  </div>
</header>

<main class="layout">
  <section class="panel panel-form">
    <h2>Einstellungen</h2>
    <div class="grid two">
      <div>
        <h3>Eigene Daten</h3>
        <div class="field"><label>Firmenname</label><input id="c-name"></div>
        <div class="field"><label>Adresse</label><textarea id="c-address" rows="3"></textarea></div>
        <div class="field"><label>E-Mail</label><input id="c-email"></div>
        <div class="field"><label>Telefon</label><input id="c-phone"></div>
        <div class="field"><label>USt-IdNr. (optional)</label><input id="c-vatid"></div>
        <div class="field"><label>IBAN</label><input id="c-iban"></div>
        <div class="field"><label>BIC</label><input id="c-bic"></div>
        <div class="field"><label>Logo (PNG/JPG)</label><input id="c-logo" type="file" accept="image/*"></div>
        <div class="field">
          <label><input type="checkbox" id="c-kleinunternehmer"> Kleinunternehmerregelung (§ 19 UStG)</label>
        </div>
        <button id="btn-save-company" class="btn">Eigene Daten speichern</button>
      </div>
      <div>
        <h3>Kundendaten</h3>
        <div class="field"><label>Kunde wählen</label>
          <select id="customer-select"></select>
        </div>
        <div class="field"><label>Kundenname/Firma</label><input id="cu-name"></div>
        <div class="field"><label>Adresse</label><textarea id="cu-address" rows="3"></textarea></div>
        <div class="field"><label>E-Mail</label><input id="cu-email"></div>
        <div class="field"><label>Telefon</label><input id="cu-phone"></div>
        <div class="row">
          <button id="btn-save-customer" class="btn">Kunde speichern</button>
          <button id="btn-delete-customer" class="btn btn-ghost">Kunde löschen</button>
        </div>

        <h3>Rechnung</h3>
        <div class="grid two">
          <div class="field"><label>Rechnungsnummer</label><input id="inv-number"></div>
          <div class="field"><label>Rechnungsdatum</label><input id="inv-date" type="date"></div>
          <div class="field"><label>Fällig am</label><input id="inv-due" type="date"></div>
          <div class="field"><label>Währung</label>
            <select id="inv-currency">
              <option value="EUR">EUR</option>
              <option value="USD">USD</option>
              <option value="GBP">GBP</option>
              <option value="CHF">CHF</option>
            </select>
          </div>
          <div class="field"><label>Standard MwSt.%</label><input id="inv-vat" type="number" value="19" min="0" max="100" step="0.1"></div>
          <div class="field">
            <label><input type="checkbox" id="inv-apply-vat"> MwSt. berechnen</label>
          </div>
        </div>
      </div>
    </div>

    <h3>Positionen</h3>
    <div id="items"></div>
    <div class="row">
      <button id="btn-add-item" class="btn">Position hinzufügen</button>
      <button id="btn-clear-items" class="btn btn-ghost">Positionen leeren</button>
    </div>

    <div class="grid two">
      <div class="field"><label>Fußzeile / Hinweise</label><textarea id="inv-notes" rows="4" placeholder="Zahlbar innerhalb von 14 Tagen ohne Abzug."></textarea></div>
      <div class="field"><label>AGB / Zahlungsbedingungen</label><textarea id="inv-terms" rows="4"></textarea></div>
    </div>

    <div class="action-bar">
      <button id="btn-preview" class="btn">Vorschau aktualisieren</button>
      <button id="btn-print" class="btn">PDF herunterladen</button>
      <button id="btn-open-print" class="btn btn-ghost">Druckvorschau öffnen</button>
    </div>
  </section>

  <section class="panel panel-preview">
    <h2>Live‑Vorschau</h2>
    <div id="invoice" class="invoice a4">
      <!-- filled by JS -->
    </div>
  </section>
</main>

<footer class="app-footer">
  <span>Offline nutzbar • PWA</span>
  <span>© 2025 HP67 • MIT License</span>
</footer>

<script src="app.js"></script>
</body>
</html>
